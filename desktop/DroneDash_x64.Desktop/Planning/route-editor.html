<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{background:#101318;font-family:Segoe UI,Arial,sans-serif}
#banner{position:absolute;z-index:1000;top:10px;left:50%;transform:translateX(-50%);
background:rgba(20,24,30,.9);color:#fff;padding:7px 12px;border-radius:5px;font-size:13px;pointer-events:none}
#metrics{position:absolute;z-index:1000;bottom:24px;left:10px;background:rgba(20,24,30,.9);color:#fff;
padding:7px 11px;border-radius:5px;font-size:13px;line-height:1.45;pointer-events:none;display:none}
#metrics .warn{color:#ffb347;font-weight:600}
#profile{position:absolute;z-index:1000;bottom:24px;left:50%;transform:translateX(-50%);display:none;
background:rgba(20,24,30,.92);color:#fff;padding:8px 10px;border-radius:5px;font-size:12px}
#profile svg text{fill:#ccc;font-size:11px}
#profile .close{float:right;cursor:pointer;margin-left:12px}
.terrain-legend button{display:block;margin-top:6px;font:inherit;cursor:pointer}
.vertex{background:#fff;border:2px solid #2f81f7;border-radius:50%;box-sizing:border-box;cursor:move}
.vertex.first{border-color:#3fb950}
.start{background:#3fb950;border:2px solid #fff;border-radius:3px;box-sizing:border-box;color:#fff;font:bold 11px/14px Segoe UI,Arial;text-align:center}
.terrain-legend{background:rgba(20,24,30,.9);color:#fff;padding:6px 9px;border-radius:5px;font-size:12px;line-height:1.5}
.terrain-legend i{display:inline-block;width:14px;height:4px;margin-right:6px;vertical-align:middle}
.midpoint{background:rgba(255,255,255,.55);border:1px solid #2f81f7;border-radius:50%;box-sizing:border-box;cursor:copy}
</style>
</head>
<body>
<div id="map"></div>
<div id="banner">Karte bereit · Zeichenmodus aus</div>
<div id="metrics"></div>
<div id="profile"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BASEMAP_KEY='dronedash.planning.basemap';

const baseLayers={
  'OpenStreetMap':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:20,maxNativeZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }),
  'Satellit (Esri)':L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:20,maxNativeZoom:19,
    attribution:'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
  })
};
const overlays={
  'Beschriftungen (Esri)':L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:20,maxNativeZoom:19,
    attribution:'Labels &copy; Esri'
  })
};

function readBasemap(){
  try{ return localStorage.getItem(BASEMAP_KEY); }catch(_){ return null; }
}
function storeBasemap(name){
  try{ localStorage.setItem(BASEMAP_KEY,name); }catch(_){}
}

const map=L.map('map',{zoomControl:true}).setView([51.1657,10.4515],6);
const initialBase=baseLayers[readBasemap()]?readBasemap():'OpenStreetMap';
baseLayers[initialBase].addTo(map);

L.control.scale({imperial:false}).addTo(map);
map.on('baselayerchange',e=>storeBasemap(e.name));

const geometryLayer=L.layerGroup().addTo(map);
const routeLayer=L.layerGroup().addTo(map);
const handleLayer=L.layerGroup().addTo(map);
const terrainLayer=L.layerGroup().addTo(map);
const startLayer=L.layerGroup().addTo(map);
const TERRAIN_COLORS={ok:'#3fb950',low:'#f0a020',collision:'#e5383b',nodata:'#8b949e'};
let pickingStart=false;
let orthoLayer=null, orthoUrl=null;
const layerControl=L.control.layers(baseLayers,overlays,{position:'topright'}).addTo(map);
let terrainLegend=null;
const banner=document.getElementById('banner');
const metricsBox=document.getElementById('metrics');
let drawing=false;
let current={points:[],strip:false};
let shape=null;

const vertexIcon=(first)=>L.divIcon({className:first?'vertex first':'vertex',iconSize:[14,14]});
const midpointIcon=L.divIcon({className:'midpoint',iconSize:[10,10]});

function post(message){ chrome.webview.postMessage(message); }

map.on('click', e=>{
  if(pickingStart){
    pickingStart=false;
    map.getContainer().style.cursor='';
    banner.textContent='Startpunkt gesetzt';
    post({type:'startPoint',lat:e.latlng.lat,lon:e.latlng.lng});
    return;
  }
  if(!drawing) return;
  post({type:'polygonPoint',lat:e.latlng.lat,lon:e.latlng.lng});
});

function setDrawing(value){
  drawing=!!value;
  pickingStart=false;
  banner.textContent=drawing?'Geometrie zeichnen · Klick fügt Punkt hinzu':'Zeichenmodus aus';
  map.getContainer().style.cursor=drawing?'crosshair':'';
}

function pickStart(){
  pickingStart=true;
  drawing=false;
  banner.textContent='Startpunkt: Position anklicken';
  map.getContainer().style.cursor='crosshair';
}

function renderStart(point){
  startLayer.clearLayers();
  if(!point) return;
  L.marker([point.latitude,point.longitude],{
    icon:L.divIcon({className:'start',html:'H',iconSize:[16,16]}),keyboard:false,zIndexOffset:900
  }).bindTooltip('Startpunkt (Home)',{direction:'top',offset:[0,-8]}).addTo(startLayer);
}

function renderOrtho(ortho){
  const url=ortho?ortho.url:null;
  if(url===orthoUrl) return;
  if(orthoLayer){ layerControl.removeLayer(orthoLayer); map.removeLayer(orthoLayer); orthoLayer=null; }
  orthoUrl=url;
  if(!ortho) return;
  // Own orthomosaic between basemap and route; finer zooms upscale the native tiles.
  orthoLayer=L.tileLayer(ortho.url,{
    bounds:L.latLngBounds(ortho.bounds),minZoom:ortho.minZoom,maxNativeZoom:ortho.maxZoom,maxZoom:23,
    zIndex:5,attribution:'Orthomosaik: '+(ortho.name||'eigene Befliegung')
  }).addTo(map);
  layerControl.addOverlay(orthoLayer,'Orthomosaik');
}

let profileMarker=null;
const profileBox=document.getElementById('profile');
function hideProfile(){
  profileBox.style.display='none';
  if(profileMarker){ map.removeLayer(profileMarker); profileMarker=null; }
}

function toggleProfile(terrain){
  if(profileBox.style.display==='block'){ hideProfile(); return; }
  profileBox.replaceChildren();
  const close=document.createElement('span'); close.className='close'; close.textContent='✕';
  close.addEventListener('click',hideProfile);
  const title=document.createElement('b'); title.textContent='Höhenprofil entlang der Route';
  profileBox.append(close,title,profileChart(terrain));
  profileBox.style.display='block';
}

// Route profile: ground, highest obstacle in the buffer, flight level and the required clearance.
function profileChart(terrain){
  const s=terrain.profile, W=640,H=206,P={l:52,r:12,t:12,b:42};
  const ns='http://www.w3.org/2000/svg', svg=document.createElementNS(ns,'svg');
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  const add=(tag,attrs,text)=>{ const n=document.createElementNS(ns,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); if(text!==undefined) n.textContent=text; svg.append(n); return n; };
  const values=s.flatMap(p=>[p.ground,p.obstacle,p.flight]).filter(v=>v!==null);
  if(!values.length){ add('text',{x:10,y:20},'Keine Höhendaten entlang der Route.'); return svg; }
  const lo=Math.min(...values)-2, hi=Math.max(...values)+5, len=Math.max(s[s.length-1].distance,1e-6);
  const x=d=>P.l+d/len*(W-P.l-P.r), y=z=>H-P.b-(z-lo)/(hi-lo)*(H-P.t-P.b);
  const path=(key,offset=0)=>{ let d='',pen=false; for(const p of s){ const v=p[key]; if(v===null){pen=false;continue;}
    d+=(pen?'L':'M')+x(p.distance).toFixed(1)+','+y(v+offset).toFixed(1); pen=true; } return d; };
  add('rect',{x:P.l,y:P.t,width:W-P.l-P.r,height:H-P.t-P.b,fill:'rgba(255,255,255,0.04)'});
  add('path',{d:path('obstacle'),fill:'none',stroke:'#8b949e','stroke-width':1.5});
  // Ground as a filled area so it reads apart from the dashed clearance line.
  const groundLine=path('ground');
  if(groundLine){
    const first=s.find(p=>p.ground!==null), last=[...s].reverse().find(p=>p.ground!==null);
    add('path',{d:groundLine+'L'+x(last.distance).toFixed(1)+','+(H-P.b)+'L'+x(first.distance).toFixed(1)+','+(H-P.b)+'Z',
      fill:'rgba(176,141,87,0.45)',stroke:'#b08d57','stroke-width':1.5});
  }
  add('path',{d:path('flight',-terrain.minClearance),fill:'none',stroke:TERRAIN_COLORS.low,'stroke-width':1,'stroke-dasharray':'4 3'});
  add('path',{d:path('flight'),fill:'none',stroke:'#58a6ff','stroke-width':2});
  add('text',{x:4,y:P.t+10},fmt(hi,0)+' m'); add('text',{x:4,y:H-P.b},fmt(lo,0)+' m');
  add('text',{x:P.l,y:H-P.b+14},'0 m'); add('text',{x:W-P.r-70,y:H-P.b+14},fmt(len,0)+' m');
  const legend=[['#58a6ff','Flughöhe'],[TERRAIN_COLORS.low,'Mindestabstand'],['#8b949e','Hindernis (Puffer)'],['#b08d57','Gelände']];
  legend.forEach(([c,t],i)=>{ add('rect',{x:P.l+8+i*130,y:H-12,width:10,height:4,fill:c}); add('text',{x:P.l+22+i*130,y:H-7},t); });
  const cursor=add('line',{x1:0,x2:0,y1:P.t,y2:H-P.b,stroke:'#fff','stroke-width':1,visibility:'hidden'});
  const label=add('text',{x:P.l+6,y:P.t+14},'');
  svg.addEventListener('mousemove',ev=>{
    const rect=svg.getBoundingClientRect(), dist=(ev.clientX-rect.left-P.l)/(W-P.l-P.r)*len;
    let best=s[0]; for(const p of s) if(Math.abs(p.distance-dist)<Math.abs(best.distance-dist)) best=p;
    cursor.setAttribute('x1',x(best.distance)); cursor.setAttribute('x2',x(best.distance)); cursor.setAttribute('visibility','visible');
    const clearance=best.flight!==null&&best.obstacle!==null?best.flight-best.obstacle:null;
    label.textContent=(best.pass?best.pass+' · ':'')+fmt(best.distance,0)+' m'+
      (clearance===null?' · keine Höhendaten':' · Abstand '+fmt(clearance,1)+' m');
    if(!profileMarker) profileMarker=L.circleMarker([best.lat,best.lon],{radius:6,color:'#fff',fillColor:'#58a6ff',fillOpacity:1}).addTo(map);
    else profileMarker.setLatLng([best.lat,best.lon]);
  });
  return svg;
}

function renderTerrain(terrain){
  terrainLayer.clearLayers();
  hideProfile();
  if(terrainLegend){ map.removeControl(terrainLegend); terrainLegend=null; }
  if(!terrain) return;
  terrain.chunks.forEach(c=>{
    L.polyline(c.points,{weight:c.status==='ok'?4:6,opacity:.95,color:TERRAIN_COLORS[c.status]||'#fff',interactive:false})
      .addTo(terrainLayer);
  });
  terrain.violations.forEach(v=>{
    L.circleMarker([v.lat,v.lon],{radius:7,weight:2,color:'#fff',fillOpacity:.9,
      fillColor:v.collision?TERRAIN_COLORS.collision:TERRAIN_COLORS.low})
      .bindTooltip((v.pass||'Route')+': '+fmt(v.clearance,1)+' m Abstand · Hindernis '+fmt(v.obstacle,1)+' m')
      .addTo(terrainLayer);
  });
  terrainLegend=L.control({position:'bottomright'});
  terrainLegend.onAdd=()=>{
    const div=L.DomUtil.create('div','terrain-legend');
    div.innerHTML='<i style="background:'+TERRAIN_COLORS.ok+'"></i>≥ '+fmt(terrain.minClearance,0)+' m<br>'+
      '<i style="background:'+TERRAIN_COLORS.low+'"></i>unter Mindestabstand<br>'+
      '<i style="background:'+TERRAIN_COLORS.collision+'"></i>Kollision<br>'+
      '<i style="background:'+TERRAIN_COLORS.nodata+'"></i>ohne Höhendaten';
    if(terrain.profile && terrain.profile.length>1){
      const button=L.DomUtil.create('button','',div);
      button.type='button'; button.textContent='Höhenprofil';
      L.DomEvent.disableClickPropagation(div);
      button.addEventListener('click',()=>toggleProfile(terrain));
    }
    return div;
  };
  terrainLegend.addTo(map);
}

function closed(){ return !current.strip && current.points.length>=3; }

function drawShape(points){
  if(shape){ geometryLayer.removeLayer(shape); shape=null; }
  if(!points.length) return;
  if(current.strip || points.length<3){
    shape=L.polyline(points,{weight:current.strip?5:2,opacity:.8});
  } else {
    shape=L.polygon(points,{weight:2,fillOpacity:.12});
  }
  shape.addTo(geometryLayer);
}

function midpoint(a,b){ return L.latLng((a.lat+b.lat)/2,(a.lng+b.lng)/2); }

function addHandles(){
  handleLayer.clearLayers();
  const pts=current.points;

  pts.forEach((p,i)=>{
    const marker=L.marker(p,{draggable:true,icon:vertexIcon(i===0),keyboard:false,zIndexOffset:1000})
      .bindTooltip('Punkt '+(i+1)+' · Rechtsklick löscht',{direction:'top',offset:[0,-8]});
    marker.on('drag',e=>{
      const live=pts.slice(); live[i]=e.target.getLatLng(); drawShape(live);
    });
    marker.on('dragend',e=>{
      const ll=e.target.getLatLng();
      post({type:'vertexMoved',index:i,lat:ll.lat,lon:ll.lng});
    });
    marker.on('contextmenu',e=>{
      L.DomEvent.stop(e);
      post({type:'vertexDeleted',index:i});
    });
    marker.addTo(handleLayer);
  });

  const edgeCount=closed()?pts.length:pts.length-1;
  for(let i=0;i<edgeCount;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    const handle=L.marker(midpoint(a,b),{draggable:true,icon:midpointIcon,keyboard:false})
      .bindTooltip('Ziehen oder klicken fügt einen Punkt ein',{direction:'top',offset:[0,-6]});
    handle.on('drag',e=>{
      const live=pts.slice(); live.splice(i+1,0,e.target.getLatLng()); drawShape(live);
    });
    handle.on('dragend',e=>{
      const ll=e.target.getLatLng();
      post({type:'vertexInserted',index:i+1,lat:ll.lat,lon:ll.lng});
    });
    handle.on('click',e=>{
      L.DomEvent.stop(e);
      const ll=e.target.getLatLng();
      post({type:'vertexInserted',index:i+1,lat:ll.lat,lon:ll.lng});
    });
    handle.addTo(handleLayer);
  }
}

function fmt(value,digits){
  return value.toLocaleString('de-DE',{minimumFractionDigits:digits,maximumFractionDigits:digits});
}

function renderMetrics(m){
  if(!m || !m.pointCount){ metricsBox.style.display='none'; return; }
  const lines=[];
  if(m.strip){
    lines.push(m.pointCount+' Trassenpunkte');
    lines.push('Länge '+fmt(m.lengthMeters,0)+' m');
  } else {
    lines.push(m.pointCount+' Eckpunkte');
    if(m.pointCount>=3){
      lines.push('Fläche '+fmt(m.areaSquareMeters/10000,2)+' ha');
      lines.push('Umfang '+fmt(m.perimeterMeters,0)+' m');
    }
    if(m.selfIntersecting) lines.push('<span class="warn">⚠ Fläche überschneidet sich selbst</span>');
  }
  metricsBox.innerHTML=lines.join('<br>');
  metricsBox.style.display='block';
}

function renderPlan(data){
  routeLayer.clearLayers();
  current={
    points:(data.polygon||[]).map(p=>L.latLng(p.latitude,p.longitude)),
    strip:data.geometryMode==='strip'
  };
  drawShape(current.points);
  addHandles();
  renderMetrics(data.metrics);
  renderOrtho(data.ortho);
  renderStart(data.startPoint);
  renderTerrain(data.terrain);

  if(data.segments){
    data.segments.forEach((s,i)=>{
      L.polyline([[s.start.latitude,s.start.longitude],[s.end.latitude,s.end.longitude]],{
        weight:3,opacity:.85,color:'#f78166',interactive:true
      }).bindTooltip((s.name||'Wayline')+' · Segment '+(i+1)).addTo(routeLayer);
    });
  }

  if(data.fitBounds){
    const layers=[...geometryLayer.getLayers(),...routeLayer.getLayers()];
    if(layers.length){
      const bounds=L.featureGroup(layers).getBounds();
      if(bounds.isValid()) map.fitBounds(bounds.pad(.15));
    }
  }
}

window.chrome.webview.addEventListener('message', e=>{
  const m=e.data||{};
  if(m.type==='setDrawing') setDrawing(m.value);
  if(m.type==='pickStart') pickStart();
  if(m.type==='render') renderPlan(m);
});

post({type:'ready'});
</script>
</body>
</html>
