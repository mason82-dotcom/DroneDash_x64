name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify real M3T thermal fixture
        shell: pwsh
        run: ./scripts/verify-m3t-thermal-fixture.ps1

      - name: Restore desktop
        run: dotnet restore desktop/DroneDash_x64.Desktop/DroneDash_x64.Desktop.csproj

      - name: Restore mock RC
        run: dotnet restore desktop/DroneDash_x64.MockRc/DroneDash_x64.MockRc.csproj

      - name: Restore thermal smoke tool
        run: dotnet restore desktop/DroneDash_x64.ThermalSmoke/DroneDash_x64.ThermalSmoke.csproj

      - name: Restore planning smoke tool
        run: dotnet restore desktop/DroneDash_x64.PlanningSmoke/DroneDash_x64.PlanningSmoke.csproj

      - name: Restore PV smoke tool
        run: dotnet restore desktop/DroneDash_x64.PvSmoke/DroneDash_x64.PvSmoke.csproj

      - name: Restore Smart Farming smoke tool
        run: dotnet restore desktop/DroneDash_x64.SmartFarmingSmoke/DroneDash_x64.SmartFarmingSmoke.csproj

      - name: Restore project smoke tool
        run: dotnet restore desktop/DroneDash_x64.ProjectSmoke/DroneDash_x64.ProjectSmoke.csproj

      - name: Build desktop
        run: dotnet build desktop/DroneDash_x64.Desktop/DroneDash_x64.Desktop.csproj --configuration Release --no-restore

      - name: Build mock RC
        run: dotnet build desktop/DroneDash_x64.MockRc/DroneDash_x64.MockRc.csproj --configuration Release --no-restore

      - name: Build thermal smoke tool
        run: dotnet build desktop/DroneDash_x64.ThermalSmoke/DroneDash_x64.ThermalSmoke.csproj --configuration Release --no-restore

      - name: Build planning smoke tool
        run: dotnet build desktop/DroneDash_x64.PlanningSmoke/DroneDash_x64.PlanningSmoke.csproj --configuration Release --no-restore

      - name: Run planning smoke test
        run: dotnet run --project desktop/DroneDash_x64.PlanningSmoke/DroneDash_x64.PlanningSmoke.csproj --configuration Release --no-build

      - name: Build PV smoke tool
        run: dotnet build desktop/DroneDash_x64.PvSmoke/DroneDash_x64.PvSmoke.csproj --configuration Release --no-restore

      - name: Run PV smoke test
        run: dotnet run --project desktop/DroneDash_x64.PvSmoke/DroneDash_x64.PvSmoke.csproj --configuration Release --no-build

      - name: Build Smart Farming smoke tool
        run: dotnet build desktop/DroneDash_x64.SmartFarmingSmoke/DroneDash_x64.SmartFarmingSmoke.csproj --configuration Release --no-restore

      - name: Run Smart Farming smoke test
        run: dotnet run --project desktop/DroneDash_x64.SmartFarmingSmoke/DroneDash_x64.SmartFarmingSmoke.csproj --configuration Release --no-build

      - name: Build project smoke tool
        run: dotnet build desktop/DroneDash_x64.ProjectSmoke/DroneDash_x64.ProjectSmoke.csproj --configuration Release --no-restore

      - name: Run project smoke test
        run: dotnet run --project desktop/DroneDash_x64.ProjectSmoke/DroneDash_x64.ProjectSmoke.csproj --configuration Release --no-build

  rc-agent:
    name: Android RC agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Assemble debug APK
        working-directory: rc-agent
        env:
          DJI_API_KEY_SECRET: ${{ secrets.DJI_API_KEY }}
          BRIDGE_TOKEN_SECRET: ${{ secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            DJI_KEY="ci-placeholder"
            BRIDGE_TOKEN_VALUE="ci-only-token"
          else
            DJI_KEY="${DJI_API_KEY_SECRET:-ci-placeholder}"
            BRIDGE_TOKEN_VALUE="${BRIDGE_TOKEN_SECRET:-ci-only-token}"
          fi

          gradle --no-daemon --stacktrace :app:assembleDebug \
            -PDJI_API_KEY="$DJI_KEY" \
            -PBRIDGE_TOKEN="$BRIDGE_TOKEN_VALUE" \
            -PBRIDGE_BIND_ADDRESS=127.0.0.1
