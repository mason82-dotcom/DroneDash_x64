name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Smart Farming Python worker
        shell: pwsh
        run: |
          $Worker = "desktop/DroneDash_x64.Desktop/SmartFarming/Workers/opencv_m3m.py"
          python -m py_compile $Worker
          $Help = (python $Worker --help | Out-String)
          if ($Help -notmatch "--index" -or
              $Help -notmatch "--geo-index" -or
              $Help -notmatch "--geo-zones" -or
              $Help -notmatch "--tile-size" -or
              $Help -notmatch "--pipeline-depth" -or
              $Help -notmatch "--backend") {
            throw "Smart Farming worker CLI is missing CUDA/GDAL pipeline options."
          }

          @'
          import importlib.util

          path = r"desktop/DroneDash_x64.Desktop/SmartFarming/Workers/opencv_m3m.py"
          spec = importlib.util.spec_from_file_location("dronedash_worker", path)
          worker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(worker)

          windows = list(worker._tile_windows(5, 3, 2))
          expected = [
              (0, 0, 2, 2),
              (2, 0, 2, 2),
              (4, 0, 1, 2),
              (0, 2, 2, 1),
              (2, 2, 2, 1),
              (4, 2, 1, 1),
          ]
          if windows != expected:
              raise RuntimeError(f"unexpected tile windows: {windows}")

          observed = list(
              worker._prefetched_tiles(
                  windows,
                  lambda window: ("payload", window),
                  2,
              )
          )
          if [window for window, _ in observed] != expected:
              raise RuntimeError("read-ahead pipeline changed tile ordering")
          if [payload[1] for _, payload in observed] != expected:
              raise RuntimeError("read-ahead pipeline payload mismatch")

          writes = []
          statistics = []
          replacements = []

          class FakeBand:
              def WriteArray(self, values, x, y):
                  writes.append((x, y, values))

              def SetStatistics(self, minimum, maximum, average, deviation):
                  statistics.append((minimum, maximum, average, deviation))

          class FakeTarget:
              def FlushCache(self):
                  writes.append(("flush",))

          fake_band = FakeBand()
          fake_target = FakeTarget()

          worker._create_geotiff_from_profile = (
              lambda *args, **kwargs:
                  ("output.tif", "temp.tif", fake_target, fake_band)
          )
          worker.os.replace = (
              lambda source, target:
                  replacements.append((source, target))
          )

          writer = worker._AsyncGeoTiffWriter(
              {"width": 4, "height": 2, "transform": None, "projection": None},
              "output.tif",
              6,
              float("nan"),
              "NDVI",
              2,
          )
          writer.submit((0, 0, 2, 2), "tile-a")
          writer.submit((2, 0, 2, 2), "tile-b")
          writer.submit((0, 2, 2, 2), "tile-c")
          result = writer.finish(
              {
                  "minimum": -1.0,
                  "maximum": 1.0,
                  "average": 0.25,
                  "standardDeviation": 0.5,
              }
          )
          writer.abort()

          if result != "output.tif":
              raise RuntimeError("async writer returned wrong output path")
          if [entry for entry in writes if len(entry) == 3] != [
              (0, 0, "tile-a"),
              (2, 0, "tile-b"),
              (0, 2, "tile-c"),
          ]:
              raise RuntimeError("async writer changed tile ordering")
          if statistics != [(-1.0, 1.0, 0.25, 0.5)]:
              raise RuntimeError("async writer did not preserve raster statistics")
          if replacements != [("temp.tif", "output.tif")]:
              raise RuntimeError("async writer did not atomically publish output")
          '@ | python -

      - name: Verify real M3T thermal fixture with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/verify-m3t-thermal-fixture.ps1

      - name: Restore desktop
        run: dotnet restore desktop/DroneDash_x64.Desktop/DroneDash_x64.Desktop.csproj

      - name: Restore mock RC
        run: dotnet restore desktop/DroneDash_x64.MockRc/DroneDash_x64.MockRc.csproj

      - name: Restore thermal smoke tool
        run: dotnet restore desktop/DroneDash_x64.ThermalSmoke/DroneDash_x64.ThermalSmoke.csproj

      - name: Restore planning smoke tool
        run: dotnet restore desktop/DroneDash_x64.PlanningSmoke/DroneDash_x64.PlanningSmoke.csproj

      - name: Restore PV smoke tool
        run: dotnet restore desktop/DroneDash_x64.PvSmoke/DroneDash_x64.PvSmoke.csproj

      - name: Restore Smart Farming smoke tool
        run: dotnet restore desktop/DroneDash_x64.SmartFarmingSmoke/DroneDash_x64.SmartFarmingSmoke.csproj

      - name: Restore project smoke tool
        run: dotnet restore desktop/DroneDash_x64.ProjectSmoke/DroneDash_x64.ProjectSmoke.csproj

      - name: Build desktop
        run: dotnet build desktop/DroneDash_x64.Desktop/DroneDash_x64.Desktop.csproj --configuration Release --no-restore

      - name: Build mock RC
        run: dotnet build desktop/DroneDash_x64.MockRc/DroneDash_x64.MockRc.csproj --configuration Release --no-restore

      - name: Build thermal smoke tool
        run: dotnet build desktop/DroneDash_x64.ThermalSmoke/DroneDash_x64.ThermalSmoke.csproj --configuration Release --no-restore

      - name: Build planning smoke tool
        run: dotnet build desktop/DroneDash_x64.PlanningSmoke/DroneDash_x64.PlanningSmoke.csproj --configuration Release --no-restore

      - name: Run planning smoke test
        run: dotnet run --project desktop/DroneDash_x64.PlanningSmoke/DroneDash_x64.PlanningSmoke.csproj --configuration Release --no-build

      - name: Build PV smoke tool
        run: dotnet build desktop/DroneDash_x64.PvSmoke/DroneDash_x64.PvSmoke.csproj --configuration Release --no-restore

      - name: Run PV smoke test
        run: dotnet run --project desktop/DroneDash_x64.PvSmoke/DroneDash_x64.PvSmoke.csproj --configuration Release --no-build

      - name: Build Smart Farming smoke tool
        run: dotnet build desktop/DroneDash_x64.SmartFarmingSmoke/DroneDash_x64.SmartFarmingSmoke.csproj --configuration Release --no-restore

      - name: Run Smart Farming smoke test
        run: dotnet run --project desktop/DroneDash_x64.SmartFarmingSmoke/DroneDash_x64.SmartFarmingSmoke.csproj --configuration Release --no-build

      - name: Build project smoke tool
        run: dotnet build desktop/DroneDash_x64.ProjectSmoke/DroneDash_x64.ProjectSmoke.csproj --configuration Release --no-restore

      - name: Run project smoke test
        run: dotnet run --project desktop/DroneDash_x64.ProjectSmoke/DroneDash_x64.ProjectSmoke.csproj --configuration Release --no-build

  rc-agent:
    name: Android RC agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Install Android API 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found below Android SDK root: $SDK_ROOT" >&2
            exit 1
          fi

          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Assemble debug APK
        working-directory: rc-agent
        env:
          DJI_API_KEY_SECRET: ${{ secrets.DJI_API_KEY }}
          BRIDGE_TOKEN_SECRET: ${{ secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            DJI_KEY="ci-placeholder"
            BRIDGE_TOKEN_VALUE="ci-only-token"
          else
            DJI_KEY="${DJI_API_KEY_SECRET:-ci-placeholder}"
            BRIDGE_TOKEN_VALUE="${BRIDGE_TOKEN_SECRET:-ci-only-token}"
          fi

          gradle --no-daemon --stacktrace :app:assembleDebug \
            -PDJI_API_KEY="$DJI_KEY" \
            -PBRIDGE_TOKEN="$BRIDGE_TOKEN_VALUE" \
            -PBRIDGE_BIND_ADDRESS=127.0.0.1
