name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/**/*.csproj', 'desktop/Directory.Build.props', 'global.json', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Validate Smart Farming Python worker
        run: python tests/python/verify_opencv_m3m_worker.py

      - name: Verify real M3T thermal fixture with Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/verify-m3t-thermal-fixture.ps1

      - name: Restore solution
        run: dotnet restore DroneDash_x64.slnx

      - name: Build solution
        run: dotnet build DroneDash_x64.slnx --configuration Release --no-restore

      - name: Run thermal smoke tool
        run: dotnet run --project desktop/DroneDash_x64.ThermalSmoke/DroneDash_x64.ThermalSmoke.csproj --configuration Release --no-build -- --allow-missing-sdk

      - name: Run planning smoke test
        run: dotnet run --project desktop/DroneDash_x64.PlanningSmoke/DroneDash_x64.PlanningSmoke.csproj --configuration Release --no-build

      - name: Run PV smoke test
        run: dotnet run --project desktop/DroneDash_x64.PvSmoke/DroneDash_x64.PvSmoke.csproj --configuration Release --no-build

      - name: Run Smart Farming smoke test
        run: dotnet run --project desktop/DroneDash_x64.SmartFarmingSmoke/DroneDash_x64.SmartFarmingSmoke.csproj --configuration Release --no-build

      - name: Run project smoke test
        run: dotnet run --project desktop/DroneDash_x64.ProjectSmoke/DroneDash_x64.ProjectSmoke.csproj --configuration Release --no-build

      - name: Run unit tests
        run: dotnet test desktop/DroneDash_x64.Tests/DroneDash_x64.Tests.csproj --configuration Release --no-build

  rc-agent:
    name: Android RC agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Install Android API 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n 1)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found below Android SDK root: $SDK_ROOT" >&2
            exit 1
          fi

          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Assemble debug APK
        working-directory: rc-agent
        env:
          DJI_API_KEY_SECRET: ${{ secrets.DJI_API_KEY }}
          BRIDGE_TOKEN_SECRET: ${{ secrets.BRIDGE_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            DJI_KEY="ci-placeholder"
            BRIDGE_TOKEN_VALUE="ci-only-token"
          else
            DJI_KEY="${DJI_API_KEY_SECRET:-ci-placeholder}"
            BRIDGE_TOKEN_VALUE="${BRIDGE_TOKEN_SECRET:-ci-only-token}"
          fi

          gradle --no-daemon --stacktrace :app:assembleDebug \
            -PDJI_API_KEY="$DJI_KEY" \
            -PBRIDGE_TOKEN="$BRIDGE_TOKEN_VALUE" \
            -PBRIDGE_BIND_ADDRESS=127.0.0.1
